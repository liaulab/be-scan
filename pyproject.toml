[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "be_scan"
version = "3.0.0"
authors = [
  { name="Calvin XY Hu", email="xiaohu@g.harvard.edu" },
  { name="Simon P Shen", email="simonshen@fas.harvard.edu" },
  { name="Christine Lee" },
  { name="Brian B Liau", email="liau@chemistry.harvard.edu" },
]
description = "A package for CRISPR base editor screening computational tools"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "matplotlib",
  "seaborn",
  "pandas",
  "scikit-learn",
  "biopython",
  "pyahocorasick", 
  "biopandas", 
  "plotly", 
  "scipy", 
  "statsmodels", 
]

[project.optional-dependencies]
test = [
    "pytest"
]
docs = [
    "sphinx",
    "myst-parser",
    "furo",
    "sphinx-autobuild",
    "nbsphinx",
    # nbconvert below 7 calls jinja2.utils.escape, removed in jinja2 3.1, and
    # the notebooks then fail to render
    "nbconvert>=7.0",
    # note: rendering notebook markdown also needs the pandoc *binary*, which
    # is a system package. .readthedocs.yaml installs it via apt; locally use
    # `conda install -c conda-forge pandoc` or `brew install pandoc`.
    "sphinxcontrib-napoleon",
]

[project.urls]
"Homepage" = "https://github.com/liaulab/be_scan"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[project.scripts]
be_scan = "be_scan.main:main"
